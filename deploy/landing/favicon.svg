<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>QRenvo</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#218062" />
      <stop offset="1" stop-color="#14523d" />
    </linearGradient>
  </defs>
  <!-- Rounded tile in the app's green -->
  <rect width="64" height="64" rx="14" fill="url(#bg)" />
  <!-- "Q" drawn as a QR finder pattern: square ring + centre block -->
  <rect x="13" y="13" width="32" height="32" rx="7" fill="none" stroke="#ffffff" stroke-width="6" />
  <rect x="23" y="23" width="12" height="12" rx="2.5" fill="#ffffff" />
  <!-- The tail of the Q, in amber -->
  <path d="M41 41 L51 51" stroke="#f59e0b" stroke-width="7" stroke-linecap="round" />
</svg>
